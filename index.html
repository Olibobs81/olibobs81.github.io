<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chaos Club</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap');

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #0b0b0b;
            color: #ffffff;
            font-family: "Space Grotesk", sans-serif;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 25px;
        }

        .content {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        .logo {
            width: 170px;
            height: 170px;
            margin: 0 auto 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 24px;
            background: #171717;
            border: 1px solid #252525;
            overflow: hidden;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .logo-text {
            font-size: 14px;
            color: #555;
        }

        h1 {
            margin: 0;
            font-size: clamp(48px, 9vw, 82px);
            font-weight: 600;
            letter-spacing: -0.06em;
        }

        .links {
            margin-top: 35px;
            display: flex;
            justify-content: center;
            gap: 28px;
        }

        .links a {
            color: #888;
            font-size: 15px;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .links a:hover {
            color: #fff;
        }

        footer {
            position: fixed;
            bottom: 22px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #444;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .logo {
                width: 130px;
                height: 130px;
                margin-bottom: 28px;
            }

            .links {
                gap: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <div class="content">

            <div class="logo">
                <!--
                    If you have a Chaos Club logo, put it in the repository
                    and change this to:

                    <img src="logo.png" alt="Chaos Club">
                -->

                <span class="logo-text">logo</span>
            </div>

            <h1>Chaos Club</h1>

            <div class="links">
                <a href="#">Discord</a>
                <a href="/chaosclub-privacy/">Privacy Policy</a>
            </div>

        </div>

    </div>

    <footer>
        © 2026 Chaos Club
    </footer>

</body>
</html>
